services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: threads
      POSTGRES_PASSWORD: threads
      POSTGRES_DB: threads
    volumes:
      - threads_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threads -d threads"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      # Reach published GitLab port on the host from inside the app container
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://threads:threads@postgres:5432/threads?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-in-production-32chars}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      # API / token exchange from the app container
      GITLAB_URL: ${GITLAB_URL:-http://host.docker.internal:8929}
      # Browser OAuth authorize redirects
      GITLAB_PUBLIC_URL: ${GITLAB_PUBLIC_URL:-http://localhost:8929}
      GITLAB_OAUTH_CLIENT_ID: ${GITLAB_OAUTH_CLIENT_ID:-}
      GITLAB_OAUTH_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:-}
      GITLAB_PROJECT_ID: ${GITLAB_PROJECT_ID:-}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # Heavy (~4GB RAM). Opt-in: docker compose --profile gitlab up --build
  gitlab:
    image: gitlab/gitlab-ce:17.11.6-ce.0
    profiles: ["gitlab"]
    restart: unless-stopped
    hostname: gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        nginx['listen_port'] = 8929
        nginx['listen_https'] = false
        # Local pilot: allow self-signup without admin approval
        gitlab_rails['require_admin_approval_after_user_signup'] = false
    ports:
      - "8929:8929"
      - "2224:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: "256mb"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8929/-/readiness >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 40
      start_period: 400s

volumes:
  threads_pg_data:
  app_node_modules:
  uploads_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
